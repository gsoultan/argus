# Argus control plane: a hand-written configuration, for reference.
#
# You do not need this file. A control plane started with no configuration
# serves its setup page at https://<host>:8080/setup and writes its own, and
# every setting below is on the console's Settings page afterwards. This is
# for running argus-control from a configuration you keep yourself, such as in
# configuration management: pass it with --config.
#
# Secrets are references, never literals — this file is world-readable in far
# too many workflows. Supply the values in /etc/argus/control.env, or from a
# mounted file with ${file:/run/secrets/name}.

# Where agents report, and -- unless console_listen is set below
# -- where people sign in too. This has to stay reachable by the fleet: a
# control plane they cannot post to keeps no recordings, no chain heads and no
# audit events, while the console goes on showing a fleet it has stopped
# hearing from. So it is not a listener to quietly move to loopback.
listen: "0.0.0.0:8080"

# Optional. Give the console its own address and the two surfaces separate:
# `listen` above then carries only what agents post to, and this
# carries only what a person signs in to. Bind it to a VPN address or an
# internal interface to take the human surface off the public one without
# taking the fleet's reporting with it.
#
# It also lets the fleet listener demand a client certificate at the handshake
# instead of per route, because nothing on it is a browser.
#
# console_listen: "127.0.0.1:8080"
#
# Behind a Cloudflare Tunnel this is the address cloudflared points at, for
# example "127.0.0.1:8090", while `listen` stays where agents
# reach it directly. See "Through a Cloudflare Tunnel" in docs/install.md.
database_url: "${ARGUS_DATABASE_URL}"
# The address people open the console at, such as https://argus.example.com.
# Alerts link to it, and the first-run log line names <console_url>/setup.
console_url: ""

# First run. While no account exists, the console offers /setup to create the
# first administrator, guarded by a one-time token this process writes to
# setup_token_file (readable by the argus user alone). It closes for good once
# any account exists. Set web_setup: false to leave `argus-control users add`
# as the only way to create the first account.
# web_setup: true
# setup_token_file: "/var/lib/argus-control/setup-token"

# This server itself. The package installs a helper, argus-control-host,
# which argus-control enrolls for its own hostname, so the server it runs on
# appears under Servers and its logs, operating system updates, disks and a
# recorded terminal are looked after from the console like any other. It
# never hooks sshd: plain SSH here stays the way in when Argus is down.
# Needs TLS served by this process. false turns it off.
# control_host: true

# The web console. The package installs it; the control plane serves it on the
# same address people sign in to, so the session cookie stays same-origin.
# Terminals, desktops and live viewing open through this control plane and the
# server's agent; there is no other address for the console to know.
console:
  dir: "/usr/share/argus/console"
  # Where servers reach the control plane, when that is not the console's own
  # address (behind a Cloudflare Tunnel, for one). "Add a server" puts it in
  # the enrollment command. Empty means the console's address.
  # fleet_url: "https://argus-internal.example.com:8080"

tls:
  cert_file: "/etc/argus/tls/server.crt"
  key_file: "/etc/argus/tls/server.key"
  # Reporter endpoints additionally require a client certificate signed by this
  # CA, so a leaked reporter token is not sufficient on its own.
  client_ca_file: "/etc/argus/tls/ca.crt"

# Agents hold one outbound connection here, so managed servers need no inbound
# port. Agents always connect over HTTPS on `listen`; with quic_listen they move
# to QUIC on UDP, which keeps sessions smooth on a lossy network. Open the same
# port for UDP in the firewall (8080/udp here). Needs `tls` above.
tunnel:
  quic_listen: "0.0.0.0:8080"

signing_secret: "${ARGUS_SIGNING_SECRET}"
reporter_token: "${ARGUS_REPORTER_TOKEN}"

# Per-client limits on the authentication surface. The defaults are already
# appropriate; a person never reaches them and a script always does.
rate_limit:
  login_per_minute: 20
  # Failures are counted far more tightly than attempts: a client producing
  # them at a rate a real user never reaches is doing something a real user
  # never does.
  failures_per_hour: 20
  tickets_per_minute: 30
  # Only set this when a load balancer terminates connections in front of
  # Argus. Trusting a forwarding header otherwise lets a client both evade its
  # own limit and throttle someone else.
  # trusted_proxies: ["10.0.0.0/8"]
  #
  # Behind a Cloudflare Tunnel whose cloudflared runs on this host, trust
  # loopback; the client's address is then read from CF-Connecting-IP.
  # trusted_proxies: ["127.0.0.1/32", "::1/128"]

session_ttl: 8h
ticket_ttl: 60s

# A browser terminal survives its connection dropping: a closed laptop, a
# reloaded tab, argus-control restarting, the agent's tunnel reconnecting. The
# server's agent keeps the shell running, and recording, for this long for the
# person to come back to; the console reconnects on its own.
# terminal_reattach_window: 5m
# Past that, a shell still running a command (an upgrade, a migration) is kept
# until the command finishes, for at most this long, then hung up. A negative
# duration hangs it up at the end of the window whatever it is doing.
# terminal_keep_running: 4h
agent_stale_after: 90s
log_level: "info"

# Tell administrators every time somebody opens a session, by email, Telegram,
# a phone push notification (Firebase Cloud Messaging), or any mix. Sessions
# that went around Argus (logged in to the server directly, seen only by the
# host agent) are alerted too, and say so. Alerts are queued
# and sent in the background; a slow mail server never holds up a session.
# Remove the comment marks from the channels you want.
#
# alerts:
#   email:
#     host: "smtp.example.com"
#     port: 587                     # 465 for implicit TLS; others upgrade with STARTTLS
#     username: "argus@example.com"
#     password: "${file:/etc/argus/smtp-password}"
#     from: "argus@example.com"
#     to: ["security@example.com"]
#     # Or send through a Panmail gateway instead of an SMTP server: set `via`
#     # and the gateway, and leave host/port/username/password out.
#     # via: "panmail"
#     # panmail:
#     #   url: "https://mail.example.com"
#     #   api_key: "${file:/etc/argus/panmail-api-key}"   # needs the email:send scope
#     #   provider_id: "0f8b8f4e-0000-4000-8000-000000000000"
#   telegram:
#     # From @BotFather. Add the bot to the group first, then use the group's id.
#     bot_token: "${file:/etc/argus/telegram-bot-token}"
#     chat_ids: ["-1001234567890"]
#   fcm:
#     # A service account key from Firebase (Project settings > Service accounts),
#     # owned by the argus user and mode 0600. Push goes to the topic your app
#     # subscribes to, and/or to individual device registration tokens.
#     credentials_file: "/etc/argus/fcm-service-account.json"
#     topic: "argus-sessions"
#     # tokens: ["<device registration token>"]

# Cloud. argus-control's own identity for each cloud, before it assumes the
# role in a connected account. Settings > Cloud identities writes this; with
# nothing here, AWS uses whatever the host gives it (an EC2 instance profile,
# a container task role, AWS_ environment variables). Off AWS, give it an IAM
# user that may only assume the Argus roles:
#   {"Effect":"Allow","Action":["sts:AssumeRole","sts:SetSourceIdentity",
#    "sts:TagSession"],"Resource":"arn:aws:iam::*:role/Argus*"}
#
# cloud:
#   aws:
#     access_key_id: "AKIA..."
#     secret_access_key: "${file:/var/lib/argus-control/secrets/aws-secret-access-key}"
#     # Or a named profile (IAM Roles Anywhere through credential_process),
#     # or a shared credentials file only the argus user can read:
#     # profile: "argus"
#     # credentials_file: "/var/lib/argus-control/aws-credentials"
#     # home_region: "us-east-1"
