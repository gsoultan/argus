# Argus control plane.
#
# Secrets are references, never literals — this file is world-readable in far
# too many workflows. Supply the values in /etc/argus/control.env, or from a
# mounted file with ${file:/run/secrets/name}.

# Where gateways and agents report, and -- unless console_listen is set below
# -- where people sign in too. This has to stay reachable by the fleet: a
# control plane they cannot post to keeps no recordings, no chain heads and no
# audit events, while the console goes on showing a fleet it has stopped
# hearing from. So it is not a listener to quietly move to loopback.
listen: "0.0.0.0:8080"

# Optional. Give the console its own address and the two surfaces separate:
# `listen` above then carries only what gateways and agents post to, and this
# carries only what a person signs in to. Bind it to a VPN address or an
# internal interface to take the human surface off the public one without
# taking the fleet's reporting with it.
#
# It also lets the fleet listener demand a client certificate at the handshake
# instead of per route, because nothing on it is a browser.
#
# console_listen: "127.0.0.1:8080"
database_url: "${ARGUS_DATABASE_URL}"
console_url: ""

# The web console. The package installs it; the control plane serves it on the
# same address people sign in to, so the session cookie stays same-origin.
# gateway_url is where browsers reach argus-gateway's web listener (terminal,
# live view, termination) -- until it is set, the console can sign people in but cannot open a terminal.
console:
  dir: "/usr/share/argus/console"
  gateway_url: ""

tls:
  cert_file: "/etc/argus/tls/server.crt"
  key_file: "/etc/argus/tls/server.key"
  # Reporter endpoints additionally require a client certificate signed by this
  # CA, so a leaked reporter token is not sufficient on its own.
  client_ca_file: "/etc/argus/tls/ca.crt"

signing_secret: "${ARGUS_SIGNING_SECRET}"
reporter_token: "${ARGUS_REPORTER_TOKEN}"

# Per-client limits on the authentication surface. The defaults are already
# appropriate; a person never reaches them and a script always does.
rate_limit:
  login_per_minute: 20
  # Failures are counted far more tightly than attempts: a client producing
  # them at a rate a real user never reaches is doing something a real user
  # never does.
  failures_per_hour: 20
  tickets_per_minute: 30
  # Only set this when a load balancer terminates connections in front of
  # Argus. Trusting a forwarding header otherwise lets a client both evade its
  # own limit and throttle someone else.
  # trusted_proxies: ["10.0.0.0/8"]

session_ttl: 8h
ticket_ttl: 60s
agent_stale_after: 90s
log_level: "info"

# Tell administrators every time somebody opens a session, by email, Telegram,
# or both. Sessions that went around Argus (logged in to the server directly,
# seen only by the host agent) are alerted too, and say so. Alerts are queued
# and sent in the background; a slow mail server never holds up a session.
# Remove the comment marks from the channels you want.
#
# alerts:
#   email:
#     host: "smtp.example.com"
#     port: 587                     # 465 for implicit TLS; others must offer STARTTLS
#     username: "argus@example.com"
#     password: "${file:/etc/argus/smtp-password}"
#     from: "argus@example.com"
#     to: ["security@example.com"]
#   telegram:
#     # From @BotFather. Add the bot to the group first, then use the group's id.
#     bot_token: "${file:/etc/argus/telegram-bot-token}"
#     chat_ids: ["-1001234567890"]
