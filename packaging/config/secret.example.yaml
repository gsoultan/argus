# argus-secret: keeps one organization's secrets. argus-control decides who may
# read what and pushes those rules here; values never leave this server except
# sealed to the caller that asked for them.
#
# Installed as /etc/argus-secret/secret.yaml (0640 root:argus-secret), then:
#   argus-secret --config /etc/argus-secret/secret.yaml --check
#   systemctl enable --now argus-secret

# Two ways for argus-control to reach this server:
#
#  - direct: argus-control and agents call this address (or a proxy in front
#    of it). Add the server in the console with its https:// address.
#  - tunnel: this server dials argus-control and needs no inbound port. Add it
#    in the console as "dials argus-control", then run once:
#      argus-secret enroll --control https://argus.example.com --token argus-secret-enrol-…
#    and restart. Set listen: off to serve over the tunnel only.
listen: ":8460"

# Database (secrets.db), TLS key and the read log. Back it up together with
# the root key, or not at all: one without the other opens nothing.
data_dir: /var/lib/argus-secret

# The root key: 32 random bytes that wrap every other key. Where it comes
# from, first match wins:
#
#  1. root_key_command: a KMS, TPM tool or hardware token prints it (raw or
#     base64), so it is never on disk in the clear. Run without a shell.
#       root_key_command: ["aws", "kms", "decrypt", "--ciphertext-blob",
#         "fileb:///etc/argus-secret/root.key.kms", "--query", "Plaintext", "--output", "text"]
#  2. a systemd credential named argus-secret-root-key, sealed to this host's
#     TPM (see LoadCredentialEncrypted= in argus-secret.service):
#       systemd-creds encrypt --with-key=tpm2 --name=argus-secret-root-key \
#         /var/lib/argus-secret/root.key /etc/credstore.encrypted/argus-secret-root-key
#       shred -u /var/lib/argus-secret/root.key
#  3. root_key_file, readable only by this server's account, made on first
#     start when missing. Anyone who copies the disk can then open every
#     secret, and argus-secret says so at each start.
# root_key_command: []
# root_key_file: /var/lib/argus-secret/root.key
#
# argus-secret rekey (service stopped) gives every value a new data key under
# a new organization key; --rotate-root also replaces root_key_file.

# Values travel sealed with ML-KEM-768 + X25519 (post-quantum) to callers that
# support it. Set this once every agent and console is updated, to refuse the
# X25519-only format as well.
post_quantum_only: false

# The organization this server keeps. argus-control refuses to push another
# organization's rules here. A tunnel server may leave it empty: enrolling
# sets it.
organization: default

# argus-control's management key (Ed25519, base64), shown in the console under
# Settings > Secrets servers when you add this server. Every management request
# must be signed by it. A tunnel server leaves it empty: enrolling sets it.
control_public_key: ""

# TLS. Leave both empty for a self-signed certificate, pinned by argus-control
# and agents when the server is enrolled.
tls:
  cert_file: ""
  key_file: ""

# Behind Cloudflare Tunnel, nginx or another proxy that terminates TLS: serve
# plain HTTP on loopback only. Values stay sealed end to end either way.
behind_tls_proxy: false

# Addresses whose CF-Connecting-IP / X-Forwarded-For headers are believed for
# the audit log and rate limits. Empty: the connecting address is the caller.
trusted_proxies: []

# Refuse reads once argus-control has not been heard from for this long, so a
# revoked grant cannot outlive a lost connection by more than this.
rules_max_age: 15m
