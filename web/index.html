<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a21" media="(prefers-color-scheme: dark)" />
    <!-- Sets the light or dark scheme before anything paints, so a dark
         console never flashes white on load. A file rather than inline,
         because the console's CSP allows no inline script. -->
    <script src="/color-scheme.js"></script>
    <meta name="description" content="Brokered, recorded and audited privileged access to Linux infrastructure." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Argus — Privileged Access Management</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Run-time settings from the control plane serving this console. -->
    <script src="/console-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
