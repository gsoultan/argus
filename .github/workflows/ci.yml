name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      # The control-plane tests exercise real database behaviour — atomic ticket
      # redemption, the row lock that admits one approver, the advisory lock
      # serialising the audit chain. They skip without a database, so CI
      # provides one rather than quietly running a smaller suite.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        # Not ./...: Go does not skip node_modules, and flatted ships Go
        # source, so ./... pulls a JavaScript dependency into the Go build.
        run: go vet $(go list ./... | grep -v '/node_modules/')

      - name: Test
        env:
          ARGUS_TEST_DATABASE_URL: postgres://argus:argus@localhost:5433/argus?sslmode=disable
        # -race is the point of running these in CI: the concurrency tests
        # around ticket redemption and audit chaining are exactly where a data
        # race would hide.
        #
        # -count=1 because these tests also migrate the service database that
        # the drift check below reads. A cached result runs nothing, so a PR that
        # leaves internal/control alone would hand that check an empty database.
        run: go test -race -count=1 -timeout 5m $(go list ./... | grep -v '/node_modules/')

      - name: Confirm the database tests actually ran
        env:
          ARGUS_TEST_DATABASE_URL: postgres://argus:argus@localhost:5433/argus?sslmode=disable
        # A skipped suite passes. Without this check, losing the database
        # service would silently shrink coverage instead of failing.
        run: |
          # -count=1: a cached result prints no SKIP line, so it would pass
          # this check without the database ever being reached.
          out=$(go test -count=1 -run TestRedeemTicketIsAtomic -v ./internal/control/ 2>&1)
          echo "$out"
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "::error::control-plane tests skipped; the database was not reachable"
            exit 1
          fi

      - name: Check the generated readers match the model
        # The committed rgen packages are 28k lines nobody reads in review.
        # This compares them to internal/control/rmodel and needs no database,
        # so it runs even if the service above is down. The same shape as the
        # probe-object check in the kernel job: an artifact in git that is
        # derived from something else in git has to be provably derived.
        run: go run ./cmd/stormgen verify -stale internal/control/rgen

      - name: Check the model matches the database
        env:
          ARGUS_TEST_DATABASE_URL: postgres://argus:argus@localhost:5433/argus?sslmode=disable
        # migrations/ is the source of truth for this schema and storm never
        # applies DDL, so nothing else keeps the model honest. This was wired
        # into scripts/check.sh only, which CI does not run -- and three
        # migrations landed against a model that knew about none of them
        # before anything noticed.
        run: go run ./cmd/stormgen verify -dsn "$ARGUS_TEST_DATABASE_URL"

      - name: Fuzz the SSH request parsers
        # These read bytes from the network before any policy runs. A panic
        # there takes down every session on the gateway, so a short fuzz run on
        # every change is cheap insurance.
        run: go test -run=Fuzz -fuzz=FuzzParsePTYRequest -fuzztime=60s ./internal/gateway/

  # The control plane, gateway and verifier ship for macOS and Windows too.
  # Cross-compiling proves they build; this proves they start, and that the
  # private-key check reads Windows access lists rather than mode bits that
  # mean nothing there.
  portable:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test what the portable binaries depend on
        run: >
          go test -count=1
          ./internal/secrets/... ./internal/hashchain/... ./internal/recorder/...
          ./internal/tunnel/... ./cmd/argus-verify/...
      - name: Test the agent
        run: go test -count=1 ./internal/agent/... ./cmd/argus-agent/...
      - name: Build and start each binary
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          for c in argus-control argus-gateway argus-verify; do
            go build -o "bin/$c$ext" "./cmd/$c"
            "./bin/$c$ext" -version
          done

  # The Linux drill in Packaging, on a Mac: the agent installed as a launchd
  # daemon, enrolled, holding its tunnel, opening a browser session as a real
  # account and recording it on the host.
  macos-agent:
    name: Agent on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          brew install --quiet postgresql@17
          pg=$(brew --prefix postgresql@17)/bin
          echo "$pg" >> "$GITHUB_PATH"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U argus --auth=trust >/dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5433" start
          "$pg/createdb" -h localhost -p 5433 -U argus argus
      - name: Install the agent, enroll it, open a session through it
        env:
          PGURL: postgres://argus@localhost:5433/argus?sslmode=disable
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          go build -o "$tmp/argus-control" ./cmd/argus-control
          go build -o "$tmp/argus-agent" ./cmd/argus-agent
          go build -o "$tmp/termdrill" ./scripts/tools/termdrill
          go run ./scripts/tools/gencerts "$tmp"
          chmod 600 "$tmp/server.key"

          # The shipped config, pointed at this runner's files.
          sed -e "s#/etc/argus/tls/#$tmp/#" -e 's#dir: "/usr/share/argus/console"#dir: ""#' \
            packaging/config/control.example.yaml > "$tmp/control.yaml"
          export ARGUS_DATABASE_URL="$PGURL" ARGUS_SIGNING_SECRET=$(openssl rand -hex 32) \
            ARGUS_REPORTER_TOKEN=$(openssl rand -hex 32)
          "$tmp/argus-control" -config "$tmp/control.yaml" >"$tmp/control.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/healthz || { tail -50 "$tmp/control.log"; exit 1; }
          printf 'ci-admin-password-0123456789\n' | \
            "$tmp/argus-control" -config "$tmp/control.yaml" users add admin@ci.example --role admin

          # Installed as the archive's launchd job says to.
          sudo install -m 0755 "$tmp/argus-agent" /usr/local/bin/argus-agent
          sudo install -m 0644 packaging/launchd/com.argus.agent.plist /Library/LaunchDaemons/
          plutil -lint /Library/LaunchDaemons/com.argus.agent.plist

          c="curl -fsS --cacert $tmp/ca.crt -c $tmp/jar -b $tmp/jar -H Content-Type:application/json"
          $c -X POST https://localhost:8080/auth/password \
            -d '{"email":"admin@ci.example","password":"ci-admin-password-0123456789"}' >/dev/null
          $c -X POST https://localhost:8080/api/v1/agents/enroll-tokens -d '{}' > "$tmp/tok.json"
          tok=$(jq -r .token "$tmp/tok.json"); pin=$(jq -r .pin "$tmp/tok.json")
          sudo argus-agent enroll --control-url https://localhost:8080 --pin "$pin" --token "$tok"
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.argus.agent.plist

          host=$(hostname)
          for i in $(seq 1 30); do
            tr=$(psql "$PGURL" -tAc "SELECT tunnel_transport FROM agent_credentials
                 WHERE lower(hostname) = lower('$host') AND revoked_at IS NULL
                   AND tunnel_rtt_us IS NOT NULL")
            [ -n "$tr" ] && break
            sleep 1
          done
          [ -n "$tr" ] || { sudo tail -40 /var/log/argus-agent.log; tail -20 "$tmp/control.log"
            echo "::error::the agent's tunnel never came up"; exit 1; }
          echo "tunnel over $tr"

          # The tunnel can come up before the first report lands.
          for i in $(seq 1 30); do
            n=$(psql "$PGURL" -tAc "SELECT count(*) FROM agents WHERE lower(hostname) = lower('$host')")
            [ "$n" = 1 ] && break
            sleep 1
          done
          [ "$n" = 1 ] || { sudo tail -40 /var/log/argus-agent.log; echo "::error::the agent never reported"; exit 1; }

          sudo sysadminctl -addUser argusdrill -password "$(openssl rand -hex 16)" -shell /bin/zsh
          sudo createhomedir -c -u argusdrill >/dev/null
          tkt=$($c -X POST https://localhost:8080/api/v1/terminal/ticket \
            -d "{\"target\":\"$host\",\"principal\":\"argusdrill\"}" | jq -r .ticket)
          set +e
          out=$("$tmp/termdrill" -url https://localhost:8080 -ca "$tmp/ca.crt" \
            -ticket "$tkt" -target "$host" -principal argusdrill \
            -input $'id -un; echo "shell=$SHELL"; touch ~/through-argus; exit 7\n' 2>"$tmp/term.err")
          code=$?
          set -e
          cat "$tmp/term.err"; echo "$out"
          [ "$code" = 7 ] && grep -q argusdrill <<<"$out" || {
            sudo tail -40 /var/log/argus-agent.log
            echo "::error::a session through the tunnel did not run as the account (exit $code)"; exit 1; }
          # The shell came from Directory Services, not /etc/passwd.
          grep -q 'shell=/bin/zsh' <<<"$out" || {
            echo "::error::the session did not get the account's login shell"; exit 1; }
          [ "$(sudo stat -f %Su /Users/argusdrill/through-argus)" = argusdrill ]
          sid=$(sed -n 's/^session=//p' "$tmp/term.err")
          sudo grep -q through-argus "/var/db/argus/recordings/$sid.cast" || {
            echo "::error::the recording on the host does not hold the session"; exit 1; }
          [ "$(sudo stat -f '%Lp %Su' /var/db/argus/recordings)" = "700 root" ]
          for i in $(seq 1 30); do
            who=$(psql "$PGURL" -tAc "SELECT user_email FROM sessions WHERE id = '$sid'::uuid")
            [ -n "$who" ] && break
            sleep 1
          done
          [ "$who" = admin@ci.example ] || {
            echo "::error::the session was reported as '$who', not the person it was opened for"; exit 1; }

          # Stopping it through launchd seals and exits cleanly.
          sudo launchctl bootout system/com.argus.agent
          sudo tail -5 /var/log/argus-agent.log

  # The same drill on Windows: the agent installed as a service running as
  # LocalSystem, enrolled, holding its tunnel, opening a console session as a
  # real local account on a pseudoconsole and recording it on the host.
  windows-agent:
    name: Agent on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Git Bash rewrites arguments that look like paths ("/add",
      # "/inheritance:r"); Windows programs need them as written.
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          pg=$(cygpath -u "$PGBIN")
          echo "$pg" >> "$GITHUB_PATH"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U argus --auth=trust >/dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5433" start
          "$pg/createdb" -h localhost -p 5433 -U argus argus
      - name: Install the agent, enroll it, open a session through it
        env:
          PGURL: postgres://argus@localhost:5433/argus?sslmode=disable
        run: |
          set -euo pipefail
          # Windows' curl asks the CA for revocation status, which a private
          # CA has nowhere to publish; the certificate itself is still checked.
          curl() { command curl --ssl-no-revoke "$@"; }
          tmp=$(cygpath -m "$RUNNER_TEMP")/drill
          mkdir -p "$tmp"
          go build -o "$tmp/argus-control.exe" ./cmd/argus-control
          go build -o "$tmp/argus-agent.exe" ./cmd/argus-agent
          go build -o "$tmp/termdrill.exe" ./scripts/tools/termdrill
          go build -o "$tmp/deskdrill.exe" ./scripts/tools/deskdrill
          go run ./scripts/tools/gencerts "$tmp"
          # The Windows "chmod 600", which the control plane checks for.
          icacls "$(cygpath -w "$tmp/server.key")" /inheritance:r /grant:r "$USERNAME:R" \
            /grant:r SYSTEM:F /grant:r Administrators:F >/dev/null

          sed -e "s#/etc/argus/tls/#$tmp/#" -e 's#dir: "/usr/share/argus/console"#dir: ""#' \
            packaging/config/control.yaml > "$tmp/control.yaml"
          export ARGUS_DATABASE_URL="$PGURL" ARGUS_SIGNING_SECRET=$(openssl rand -hex 32) \
            ARGUS_REPORTER_TOKEN=$(openssl rand -hex 32)
          "$tmp/argus-control.exe" -config "$tmp/control.yaml" >"$tmp/control.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/healthz || { tail -50 "$tmp/control.log"; exit 1; }
          printf 'ci-admin-password-0123456789\n' | \
            "$tmp/argus-control.exe" -config "$tmp/control.yaml" users add admin@ci.example --role admin

          # Installed as docs/install.md says.
          inst="/c/Program Files/Argus"
          mkdir -p "$inst"
          cp "$tmp/argus-agent.exe" "$inst/"
          agent="$inst/argus-agent.exe"

          c="curl -fsS --cacert $tmp/ca.crt -c $tmp/jar -b $tmp/jar -H Content-Type:application/json"
          $c -X POST https://localhost:8080/auth/password \
            -d '{"email":"admin@ci.example","password":"ci-admin-password-0123456789"}' >/dev/null
          $c -X POST https://localhost:8080/api/v1/agents/enroll-tokens -d '{}' > "$tmp/tok.json"
          tok=$(jq -r .token "$tmp/tok.json"); pin=$(jq -r .pin "$tmp/tok.json")
          "$agent" enroll --control-url https://localhost:8080 --pin "$pin" --token "$tok"
          "$agent" service install

          # The credential, and everything else the agent keeps, is out of
          # reach of the accounts it records.
          acl=$(icacls 'C:\ProgramData\Argus')
          echo "$acl"
          if grep -Eqi 'Users|Everyone|CREATOR OWNER' <<<"$acl"; then
            echo "::error::the agent's state directory is open to other accounts"; exit 1
          fi

          host=$(hostname)
          log='C:\ProgramData\Argus\agent.log'
          for i in $(seq 1 30); do
            tr=$(psql "$PGURL" -tAc "SELECT tunnel_transport FROM agent_credentials
                 WHERE lower(hostname) = lower('$host') AND revoked_at IS NULL
                   AND tunnel_rtt_us IS NOT NULL")
            [ -n "$tr" ] && break
            sleep 1
          done
          [ -n "$tr" ] || { tail -40 "$log"; tail -20 "$tmp/control.log"
            echo "::error::the agent's tunnel never came up"; exit 1; }
          echo "tunnel over $tr"
          n=$(psql "$PGURL" -tAc "SELECT count(*) FROM agents WHERE lower(hostname) = lower('$host')")
          [ "$n" = 1 ] || { tail -40 "$log"; echo "::error::the agent never reported"; exit 1; }

          # A local account that has never logged on: its profile is made by
          # the session, as an interactive logon would make it.
          # Under 15 characters: net asks before setting a longer password,
          # and there is nobody to answer.
          DRILL_PASSWORD="Dr1ll-$(openssl rand -hex 4)"
          export DRILL_PASSWORD
          net user argusdrill "$DRILL_PASSWORD" /add >/dev/null
          tkt=$($c -X POST https://localhost:8080/api/v1/terminal/ticket \
            -d "{\"target\":\"$host\",\"principal\":\"argusdrill\"}" | jq -r .ticket)
          set +e
          out=$("$tmp/termdrill.exe" -url https://localhost:8080 -ca "$tmp/ca.crt" \
            -ticket "$tkt" -target "$host" -principal argusdrill \
            -input $'whoami\recho home=%USERPROFILE%\rtype nul > "%USERPROFILE%\\through-argus"\rexit 7\r' \
            2>"$tmp/term.err")
          code=$?
          set -e
          cat "$tmp/term.err"; echo "$out"
          [ "$code" = 7 ] && grep -qi '\\argusdrill' <<<"$out" || {
            sleep 30; tail -40 "$log"
            echo "::error::a session through the tunnel did not run as the account (exit $code)"; exit 1; }
          owner=$(powershell -NoProfile -Command "(Get-Acl 'C:\Users\argusdrill\through-argus').Owner")
          grep -qi 'argusdrill' <<<"$owner" || {
            echo "::error::the file the session wrote is owned by '$owner', not the account"; exit 1; }
          sid=$(sed -n 's/^session=//p' "$tmp/term.err" | tr -d '\r')
          grep -q through-argus "/c/ProgramData/Argus/recordings/$sid.cast" || {
            echo "::error::the recording on the host does not hold the session"; exit 1; }
          for i in $(seq 1 30); do
            who=$(psql "$PGURL" -tAc "SELECT user_email FROM sessions WHERE id = '$sid'::uuid")
            [ -n "$who" ] && break
            sleep 1
          done
          [ "$who" = admin@ci.example ] || {
            echo "::error::the session was reported as '$who', not the person it was opened for"; exit 1; }

          # A domain account is refused, not half-opened.
          tkt=$($c -X POST https://localhost:8080/api/v1/terminal/ticket \
            -d "{\"target\":\"$host\",\"principal\":\"CORP\\\\ana\"}" | jq -r .ticket)
          if [ "$tkt" != null ] && "$tmp/termdrill.exe" -url https://localhost:8080 -ca "$tmp/ca.crt" \
               -ticket "$tkt" -target "$host" -principal 'CORP\ana' -input $'exit\r' 2>&1; then
            echo "::error::a session for a domain account was opened"; exit 1
          fi

          # Remote Desktop through the agent: the runner's own listener, with
          # network level authentication as Windows has it by default, signed
          # in as the account with its password.
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server' \
            /v fDenyTSConnections /t REG_DWORD /d 0 /f >/dev/null
          net localgroup "Remote Desktop Users" argusdrill /add >/dev/null
          sc.exe config TermService start= demand >/dev/null || true
          net start TermService >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            netstat -an | grep -q ':3389 .*LISTENING' && break
            sleep 1
          done
          netstat -an | grep ':3389 ' || { echo "::error::Remote Desktop is not listening on the runner"; exit 1; }
          tkt=$($c -X POST https://localhost:8080/api/v1/terminal/ticket \
            -d "{\"target\":\"$host\",\"principal\":\"argusdrill\"}" | jq -r .ticket)
          "$tmp/deskdrill.exe" -url https://localhost:8080 -ca "$tmp/ca.crt" \
            -ticket "$tkt" -target "$host" -principal argusdrill \
            -password-env DRILL_PASSWORD -frames 3 2>"$tmp/desk.err" || {
              cat "$tmp/desk.err"; sleep 5; tail -40 "$log"
              echo "::error::a Remote Desktop did not open through the agent"; exit 1; }
          cat "$tmp/desk.err"
          dsid=$(sed -n 's/^session=//p' "$tmp/desk.err" | tr -d '\r')
          for i in $(seq 1 30); do
            st=$(psql "$PGURL" -tAc "SELECT state || ' ' || user_email || ' ' || protocol
                 FROM sessions WHERE id = '$dsid'::uuid")
            [ "${st%% *}" = closed ] && break
            sleep 1
          done
          [ "$st" = "closed admin@ci.example rdp" ] || { tail -40 "$log"
            echo "::error::the desktop was reported as '$st'"; exit 1; }
          rec="/c/ProgramData/Argus/recordings/$dsid.argusrdp"
          [ -s "$rec" ] || { echo "::error::the desktop's recording is not on the host"; exit 1; }
          if grep -q "$DRILL_PASSWORD" "$rec" "$log"; then
            echo "::error::the account's password was written down on the host"; exit 1
          fi

          # Stopping the service seals and exits cleanly.
          "$agent" service stop
          for i in $(seq 1 30); do
            sc.exe query argus-agent | grep -q STOPPED && break
            sleep 1
          done
          sc.exe query argus-agent | grep -q STOPPED
          tail -5 "$log"
          grep -q 'shutdown complete' "$log"

  ebpf:
    name: Kernel probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Confirm this runner can actually load a probe
        # Stated up front so a runner image change that removes BTF or
        # tracepoint support fails here, naming the reason, rather than turning
        # every kernel test into a skip that nobody notices.
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux || {
            echo "::error::runner kernel has no BTF; CO-RE relocations cannot resolve"
            exit 1
          }
          # Checked as root, as the tests run. Where tracefs is readable by
          # root only, an unprivileged test -d fails on a runner that can load
          # the probe perfectly well, and then tries to mount it a second time.
          sudo test -d /sys/kernel/tracing/events/sched/sched_process_exec ||
            sudo mount -t tracefs nodev /sys/kernel/tracing
          sudo test -d /sys/kernel/tracing/events/sched/sched_process_exec || {
            echo "::error::sched tracepoints are unavailable on this runner"
            exit 1
          }
          echo "kernel $(uname -r), BTF $(stat -c %s /sys/kernel/btf/vmlinux) bytes"

      - name: Check the committed probe object matches its source
        # The object is committed so `go build` works without an LLVM that
        # targets BPF. That makes drift invisible: editing exec.bpf.c and
        # forgetting to rebuild leaves CI testing the old program while the
        # source claims something else. The build is byte-reproducible for a
        # given toolchain, so comparing hashes catches it.
        run: |
          set -euo pipefail
          cp internal/execlog/bpf/exec.bpf.o /tmp/committed.o
          ./scripts/build-bpf.sh --runtime docker
          if ! cmp -s /tmp/committed.o internal/execlog/bpf/exec.bpf.o; then
            echo "::error::internal/execlog/bpf/exec.bpf.o is stale. Run scripts/build-bpf.sh and commit the result."
            exit 1
          fi
          echo "probe object is current"

      - name: Run the kernel-side tests
        # Compiled first and run under sudo, rather than `sudo go test`, so the
        # toolchain and module cache stay in the normal user's environment.
        #
        # ARGUS_EXECLOG_ALLOW_PIDNS is deliberately not set: a GitHub runner is
        # in the host PID namespace, so this exercises the same path an agent
        # takes on a real host.
        run: |
          set -euo pipefail
          go test -c -o /tmp/execlog.test ./internal/execlog/
          sudo /tmp/execlog.test -test.v -test.timeout 5m 2>&1 | tee /tmp/kernel.log

      - name: Confirm the kernel tests were not skipped
        # A skipped suite passes. Every kernel-side test skips without a capable
        # kernel or without root, so without this a broken runner would quietly
        # reduce this job to compiling the tests.
        run: |
          set -euo pipefail
          if grep -q -- "--- SKIP: TestProbe" /tmp/kernel.log; then
            echo "::error::kernel probe tests skipped; the probe never loaded"
            grep -- "--- SKIP" /tmp/kernel.log
            exit 1
          fi
          # `grep -c` prints its count and still exits 1 when that count is
          # zero, so `|| echo 0` would append a second line and make the
          # comparison below fail open — the check would report success on a run
          # where nothing passed.
          n=$(grep -c -- "--- PASS: TestProbe" /tmp/kernel.log || true)
          if [ "$n" -lt 6 ]; then
            echo "::error::only $n kernel probe tests ran; expected at least 6"
            exit 1
          fi
          echo "$n kernel-side tests passed against $(uname -r)"

  web:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The suite, not just the type check. Every defect found in the console
      # rewrite was invisible to tsc; the route tests render the real route
      # tree and the chain test asserts the WASM digest still matches WebCrypto.
      - run: bun run test
      # Built against the fixture so the output is the one the route tests
      # exercised, and so a build that only works with a control plane
      # configured fails here rather than on first deploy.
      - run: bunx vite build
        env:
          VITE_CONTROL_URL: ""
      - name: Confirm the service worker still denies the auth path
        # The rule that broke SSO for every returning visitor. It is one regex
        # in vite.config.ts and nothing else would notice it going missing.
        run: |
          grep -q 'auth' dist/sw.js || {
            echo "::error::generated service worker does not denylist /auth/ — SSO will loop"
            exit 1
          }
      - name: Confirm the dev config does not mark cookies Secure
        # The dev console is served by Vite over plain HTTP and proxies to the
        # control plane, so a Secure session cookie on that origin is one the
        # browser may discard. Safari discards it: sign-in returned 200, stored
        # nothing, and put you back on the form with no error. Chrome allows it
        # on localhost, so this reproduces on one machine and not the next.
        #
        # Only the dev example is checked. Production leaves secure_cookies
        # unset and inherits Secure from its tls: block, which is correct.
        run: |
          set -euo pipefail
          grep -qE '^secure_cookies:[[:space:]]*false' ../dev/control.yaml.example || {
            echo "::error::dev/control.yaml.example must set secure_cookies: false — the dev console is reached over HTTP and Safari drops a Secure cookie, making sign-in fail silently"
            exit 1
          }

  console-e2e:
    name: Console in a browser
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile

      # Two engines' browsers are ~400 MB and the slowest step in this job by
      # some way. Keyed on the lockfile: Playwright pins a browser build per
      # release, so the cache has to be dropped whenever that pin can move.
      - uses: actions/cache@v4
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          # ImageOS too: WebKit is built per distribution release, so a build
          # cached on one Ubuntu will not launch when ubuntu-latest moves on.
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('web/bun.lock') }}

      # The browsers are cached; the system libraries they link against are not,
      # because they are apt packages outside that path. So a hit still installs
      # dependencies, it just does not re-download Chromium and WebKit.
      - if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit
      - if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit

      # Every route with zero console errors, the fonts actually loading, the
      # audit chain verifying in WASM, and -- the reason this job exists --
      # the replay heap staying flat on an 8 MB recording. These were all
      # measured by hand once; this is what keeps them true.
      #
      # Also the sign-in screen, on both engines, against e2e/authstub.mjs. The
      # rest of the suite builds with no control plane configured, where
      # LoginGate waves everything through -- so that screen went untested until
      # two bugs had already shipped through the gap.
      #
      # And the cascade: app.css hand-maintains the order of ~47 Mantine
      # stylesheets, so cascade.spec.ts builds a second bundle using Mantine's
      # concatenated one and compares getComputedStyle across every route. A
      # reordered import or a component with no stylesheet compiles, type-checks
      # and passes every other check in this file.
      #
      # Unfiltered on purpose: `playwright test` picks up every spec under e2e/,
      # so a new one is covered here without touching this workflow.
      - run: bun run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # argus-control's package carries the built console.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      # Build the packages on every change rather than discovering at release
      # time that packaging broke three commits ago.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish

      - name: Install the agent package and exercise it
        # A package that builds is not a package that installs. This catches
        # postinstall bugs, wrong file modes and missing dependencies.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
          deb=$(ls dist/argus-agent*linux_amd64.deb)
          sudo dpkg -i "$deb"

          argus-agent version
          getent passwd argus

          test -f /lib/systemd/system/argus-agent.service

          # These need sudo precisely because the property under test holds:
          # /var/lib/argus is 0700 argus and /etc/argus is 0750 root:argus, so
          # an ordinary account cannot traverse either. Running stat unprivileged
          # failed with "permission denied" -- which was the package behaving
          # correctly and the check misreading it as a fault.
          #
          # The recorded user must not be able to reach their own recording.
          [ "$(sudo stat -c '%a %U:%G' /var/lib/argus/recordings)" = "700 root:root" ]
          [ "$(sudo stat -c '%a %U:%G' /var/lib/argus)" = "700 argus:argus" ]
          # Secrets are not world readable.
          [ "$(sudo stat -c '%a %U:%G' /etc/argus/agent.env)" = "600 root:argus" ]
          [ "$(sudo stat -c '%a %U:%G' /etc/argus)" = "750 root:argus" ]

          # And state it from the other side: an unprivileged account is
          # genuinely refused, rather than the directory merely being labelled.
          if sudo -u nobody test -r /var/lib/argus/recordings; then
            echo "::error::an unprivileged account can read the recordings directory"
            exit 1
          fi

          sudo systemd-analyze verify /lib/systemd/system/argus-agent.service
          argus-agent scan --shim /usr/bin/argus-agent || true

      - name: Install the control plane, start it, enroll an agent, back up
        # The first production install is the wrong place to find out that
        # only the agent package was ever installed. This does what
        # docs/install.md tells an operator to do, on a clean runner, from the
        # packages this build produced.
        env:
          PGURL: postgres://argus:argus@localhost:5433/argus?sslmode=disable
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          # The database for the clean-install check: a control plane that
          # installs but cannot start against a real one has not been tested.
          # Its major version is the runner's postgresql-client's, started
          # here rather than as a service so it follows the image: pg_dump
          # refuses a newer server, and pg_restore writes settings an older
          # one rejects (17's transaction_timeout broke this against 16).
          pgmajor=$(pg_dump --version | grep -oE '[0-9]+' | head -n1)
          docker run -d --name argus-pg -p 5433:5432 \
            -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus -e POSTGRES_DB=argus \
            "postgres:${pgmajor}-alpine" >/dev/null
          for _ in $(seq 1 60); do
            pg_isready -q -h localhost -p 5433 -U argus && break
            sleep 1
          done
          pg_isready -h localhost -p 5433 -U argus
          # One host carrying all of them, as a small deployment does: no two
          # packages may own the same file.
          sudo dpkg -i $(ls dist/argus-control*linux_amd64.deb) $(ls dist/argus-gateway*linux_amd64.deb) \
            $(ls dist/argus-verify*linux_amd64.deb)
          argus-verify -h >/dev/null 2>&1 || [ -x /usr/bin/argus-verify ]
          argus-control -version
          argus-gateway -version || argus-gateway --version || true

          for u in argus-control.service argus-gateway.service argus-backup.service argus-backup.timer; do
            sudo systemd-analyze verify "/lib/systemd/system/$u"
          done
          [ "$(sudo stat -c '%a %U:%G' /var/backups/argus)" = "700 argus:argus" ]
          [ "$(sudo stat -c '%a %U:%G' /etc/argus/control.env)" = "600 root:argus" ]
          # Nothing starts on install.
          ! systemctl is-active --quiet argus-control
          ! systemctl is-enabled --quiet argus-backup.timer

          # Nothing is configured by hand. With no configuration the control
          # plane serves only its setup page, over a certificate of its own,
          # guarded by a token only the host can read -- and writes its
          # configuration, secrets and certificates from what the page sends.
          tmp=$(mktemp -d)
          sudo systemctl enable --now argus-control
          for i in $(seq 1 30); do
            sudo test -s /var/lib/argus-control/setup-token && break
            sleep 1
          done
          sudo cat /var/lib/argus-control/tls/ca.crt > "$tmp/ca.crt" || {
            sudo journalctl -u argus-control --no-pager | tail -50; exit 1; }
          # Every page goes to /setup until it is done.
          to=$(curl -s -o /dev/null -w '%{redirect_url}' --cacert "$tmp/ca.crt" https://localhost:8080/assets)
          [ "$to" = https://localhost:8080/setup ] || { echo "::error::first run did not send /assets to /setup (got '$to')"; exit 1; }
          curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/setup | grep -q '<div id="root">'
          tok=$(sudo cat /var/lib/argus-control/setup-token)
          jq -n --arg tok "$tok" '{token: $tok,
              database: {host: "localhost", port: 5433, name: "argus", user: "argus", password: "argus", sslMode: "disable"},
              consoleUrl: "https://localhost:8080", fleetUrl: "", port: 8080, quic: true,
              certPem: "", keyPem: "",
              admin: {email: "admin@ci.example", displayName: "CI", password: "ci-admin-password-0123456789"}}' |
            curl -fsS --cacert "$tmp/ca.crt" -H Content-Type:application/json -d @- \
              https://localhost:8080/auth/setup/install
          for i in $(seq 1 30); do
            curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/healthz | grep -q '"ok"' && break
            sleep 1
          done
          curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/healthz | grep -q '"ok"' || {
            sudo journalctl -u argus-control --no-pager | tail -50; exit 1; }
          # What setup wrote is the service's own, and nobody else's.
          [ "$(sudo stat -c '%a %U' /var/lib/argus-control/control.yaml)" = "600 argus" ]
          [ "$(sudo stat -c '%a %U' /var/lib/argus-control/secrets/signing-secret)" = "600 argus" ]
          [ "$(sudo stat -c '%a %U' /var/lib/argus-control/tls/ca.key)" = "600 argus" ]
          ! sudo test -e /var/lib/argus-control/setup-token

          # The console ships in the package and is served same-origin.
          curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/assets/add | grep -q '<div id="root">'
          curl -fsS --cacert "$tmp/ca.crt" https://localhost:8080/console-config.js | grep -q fleetUrl

          # Enroll this runner's agent with a token from the console API.
          c="curl -fsS --cacert $tmp/ca.crt -c $tmp/jar -b $tmp/jar -H Content-Type:application/json"
          $c -X POST https://localhost:8080/auth/password \
            -d '{"email":"admin@ci.example","password":"ci-admin-password-0123456789"}' >/dev/null
          $c -X POST https://localhost:8080/api/v1/agents/enroll-tokens -d '{}' > "$tmp/tok.json"
          tok=$(jq -r .token "$tmp/tok.json"); pin=$(jq -r .pin "$tmp/tok.json")
          sudo argus-agent enroll --control-url https://localhost:8080 --pin "$pin" --token "$tok"
          # Spent: the same token must not enroll a second time.
          if sudo argus-agent enroll --control-url https://localhost:8080 --pin "$pin" \
               --token "$tok" --state "$tmp/again" --hostname other; then
            echo "::error::a single-use enrollment token was accepted twice"; exit 1
          fi
          sudo systemctl start argus-agent
          for i in $(seq 1 30); do
            n=$(psql "$PGURL" -tAc "SELECT count(*) FROM agents WHERE lower(hostname) = lower('$(hostname)')")
            [ "$n" = 1 ] && break
            sleep 1
          done
          [ "$n" = 1 ] || { sudo journalctl -u argus-agent --no-pager | tail -30
            echo "::error::the enrolled agent never reported"; exit 1; }

          # The tunnel: the packaged config offers QUIC, so the agent must end
          # up on it, through the shipped units' sandboxing, and the control
          # plane must have measured the path.
          for i in $(seq 1 30); do
            tr=$(psql "$PGURL" -tAc "SELECT tunnel_transport FROM agent_credentials
                 WHERE lower(hostname) = lower('$(hostname)') AND revoked_at IS NULL
                   AND tunnel_rtt_us IS NOT NULL")
            [ "$tr" = quic ] && break
            sleep 1
          done
          [ "$tr" = quic ] || { sudo journalctl -u argus-agent -u argus-control --no-pager | grep -i tunnel | tail -30
            echo "::error::the agent's tunnel never came up over QUIC (got '$tr')"; exit 1; }

          # A browser session through the tunnel, opened the way the console
          # opens one: a ticket from the console API, relayed by the control
          # plane, checked and opened by the agent as a real account. It writes
          # to its home directory, which the agent's own unit sees read-only,
          # so this fails if the shell inherited the agent's sandbox.
          sudo useradd -m -s /bin/bash argusdrill
          tkt=$($c -X POST https://localhost:8080/api/v1/terminal/ticket \
            -d "{\"target\":\"$(hostname)\",\"principal\":\"argusdrill\"}" | jq -r .ticket)
          # Built, not `go run`: go run exits 1 for any non-zero status, and
          # the status is part of what is checked.
          go build -o "$tmp/termdrill" ./scripts/tools/termdrill
          set +e
          out=$("$tmp/termdrill" -url https://localhost:8080 -ca "$tmp/ca.crt" \
            -ticket "$tkt" -target "$(hostname)" -principal argusdrill \
            -input $'id -un; touch ~/through-argus; exit 7\n' 2>"$tmp/term.err")
          code=$?
          set -e
          cat "$tmp/term.err"
          [ "$code" = 7 ] && grep -q argusdrill <<<"$out" || {
            echo "$out"; sudo journalctl -u argus-agent --no-pager | tail -30
            echo "::error::a session through the tunnel did not run as the account (exit $code)"; exit 1; }
          [ "$(sudo stat -c %U /home/argusdrill/through-argus)" = argusdrill ] || {
            echo "::error::the session could not write to its own home: it inherited the agent's sandbox"; exit 1; }
          sid=$(sed -n 's/^session=//p' "$tmp/term.err")
          sudo grep -q through-argus "/var/lib/argus/recordings/$sid.cast" || {
            echo "::error::the recording on the host does not hold the session"; exit 1; }
          for i in $(seq 1 30); do
            who=$(psql "$PGURL" -tAc "SELECT user_email FROM sessions WHERE id = '$sid'::uuid")
            [ -n "$who" ] && break
            sleep 1
          done
          [ "$who" = admin@ci.example ] || {
            echo "::error::the session was reported as '$who', not the person it was opened for"; exit 1; }
          n=$(psql "$PGURL" -tAc "SELECT count(*) FROM audit_events WHERE action = 'terminal.opened'
                AND actor_email = 'admin@ci.example' AND target = '$(hostname)' AND detail LIKE '%$sid%'")
          [ "$n" = 1 ] || { echo "::error::no audit entry for the session"; exit 1; }

          # A backup through the shipped unit, then proof that it restores.
          sudo systemctl start argus-backup.service
          sudo journalctl -u argus-backup --no-pager | tail -10
          run=$(sudo ls /var/backups/argus | grep -E '^[0-9]{8}T' | tail -1)
          sudo test -f "/var/backups/argus/$run/manifest.json"
          psql "$PGURL" -c 'CREATE DATABASE argus_drill'
          sudo sh -c 'argus-control backup verify \
            -scratch-db "postgres://argus:argus@localhost:5433/argus_drill?sslmode=disable" \
            /var/backups/argus/'"$run"

      - name: Confirm the shipped config does not expose the SSH port
        # A shipped default reaches every install that never edits the file,
        # which is most of them. The browser terminal is the intended way in
        # and does not touch this listener at all -- webssh calls the same Dial
        # in-process -- so 0.0.0.0 here buys nothing and puts authorized_keys
        # on the internet. Native-client access is opt-in, and this is what
        # stops that decision drifting back by accident.
        run: |
          set -euo pipefail
          listen=$(grep -E '^listen:' packaging/config/gateway.yaml)
          echo "$listen"
          case "$listen" in
            *0.0.0.0*|*'"[::]'*|*'"*:'*)
              echo "::error::packaging/config/gateway.yaml exposes the SSH listener by default; exposing it is an operator's decision, not a shipped one"
              exit 1 ;;
          esac

      - name: Confirm the units are hardened
        run: |
          set -euo pipefail
          for unit in packaging/systemd/*.service; do
            echo "checking $unit"
            grep -q '^NoNewPrivileges=yes' "$unit"
            grep -q '^ProtectSystem=strict' "$unit"
            grep -q '^SystemCallArchitectures=native' "$unit"
            # notify types would hang: none of these implement sd_notify.
            # oneshot is for units a timer runs to completion (backups).
            grep -Eq '^Type=(exec|oneshot)$' "$unit"
          done
