name: Release

on:
  push:
    # Bare version tags too, only so a release tagged 1.2.0 fails loudly
    # below instead of never building: 1.2.0 was published that way, by hand,
    # with no files, and agents and the install script cannot use it.
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write   # create the release and upload artifacts
  id-token: write   # cosign keyless signing binds to this OIDC identity
  packages: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Agents update from <releases>/download/v<version>/, and the release
      # watcher only offers v-tagged releases, so a release must be tagged
      # v1.2.3.
      - name: Check the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Tag releases as v<major>.<minor>.<patch> (v${GITHUB_REF_NAME#v}), not ${GITHUB_REF_NAME}. Delete this tag and its release, then push the v tag: agents cannot update from a release without the v."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          # GoReleaser needs full history for the changelog, and the tag needs
          # its annotation for the version to be derived correctly.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A release that ships untested code is worse than no release. The full
      # suite runs again here rather than trusting that CI passed on the commit
      # the tag happens to point at.
      - name: Test
        env:
          ARGUS_TEST_DATABASE_URL: postgres://argus:argus@localhost:5433/argus?sslmode=disable
        run: go test -race -timeout 5m ./...

      # The console is built into argus-control's package.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        # For the SBOM. A privileged-access product should be able to answer
        # "what is in this binary" without the customer reverse engineering it.
        uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release without agent and control plane packages is passed over by the console and by
      # the install script, so it must not look finished. Fail the run if
      # goreleaser left any out.
      - name: Check the agent packages were attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          have=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=""
          for want in checksums.txt argus-control_${v}_migrations.json \
            argus-control_${v}_linux_amd64.deb argus-control_${v}_linux_arm64.deb \
            argus-agent_${v}_linux_amd64.deb argus-agent_${v}_linux_arm64.deb \
            argus-agent_${v}_linux_amd64.rpm argus-agent_${v}_linux_arm64.rpm \
            argus-agent_${v}_linux_amd64.apk argus-agent_${v}_linux_arm64.apk; do
            printf '%s\n' "$have" | grep -qxF "$want" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::Release $GITHUB_REF_NAME is missing:$missing"
            exit 1
          fi

      - name: Summarise
        run: |
          {
            echo "## Released \`${GITHUB_REF_NAME}\`"
            echo
            echo "The release is a **draft** — review the notes, confirm the"
            echo "artifacts, then publish."
            echo
            echo "| Package | Goes on |"
            echo "|---|---|"
            echo "| \`argus-agent\` | every managed host |"
            echo "| \`argus-control\` | the control plane servers |"
            echo "| \`argus-verify\` | wherever recordings are checked |"
            echo
            echo "macOS and Windows archives carry argus-control, argus-verify"
            echo "and argus-agent. The Windows installers (.msi) are attached by"
            echo "the Windows installer job: wait for it before publishing."
          } >> "$GITHUB_STEP_SUMMARY"

  # The Windows installers, built on Windows (WiX needs it) from the
  # argus-agent.exe in the release's own zip, so an installed agent and one
  # the console updates run the same file. Each .msi is signed with cosign
  # like checksums.txt, as <name>.msi.sig and <name>.msi.pem.
  windows-installer:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build, sign and attach the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $v = $tag.TrimStart('v')
          $d = Join-Path $env:RUNNER_TEMP 'msi'
          New-Item -ItemType Directory -Force $d | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $d `
            --pattern "argus_${v}_windows_*.zip" --pattern checksums.txt
          if ($LASTEXITCODE -ne 0) { throw 'the release zips could not be downloaded' }
          $sums = Get-Content "$d\checksums.txt"
          $first = $true
          foreach ($arch in 'amd64', 'arm64') {
            $zip = "argus_${v}_windows_${arch}.zip"
            # The zip is the one checksums.txt, which is signed, vouches for.
            $want = ($sums | Where-Object { $_ -match "  $([regex]::Escape($zip))$" }) -replace '\s.*$', ''
            $have = (Get-FileHash "$d\$zip" -Algorithm SHA256).Hash.ToLower()
            if (-not $want -or $want -ne $have) { throw "$zip does not match checksums.txt" }
            Expand-Archive "$d\$zip" "$d\$arch" -Force
            $msi = "$d\argus-agent_${v}_windows_${arch}.msi"
            $extra = @{}
            if ($first) { $extra.InstallWix = $true; $first = $false }
            ./packaging/windows/build-msi.ps1 -Exe "$d\$arch\argus-agent.exe" -Version $v `
              -Arch $arch -Out $msi @extra
            cosign sign-blob --yes --output-signature "$msi.sig" --output-certificate "$msi.pem" $msi
            if ($LASTEXITCODE -ne 0) { throw "$msi could not be signed" }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber $msi "$msi.sig" "$msi.pem"
            if ($LASTEXITCODE -ne 0) { throw "$msi could not be attached" }
          }

      - name: Summarise
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          @(
            '### Windows installers'
            ''
            "argus-agent_${v}_windows_amd64.msi and argus-agent_${v}_windows_arm64.msi, each with .sig and .pem."
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
