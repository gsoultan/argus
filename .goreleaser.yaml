# GoReleaser builds Argus and packages it.
#
#   argus-control, argus-gateway, argus-verify   Linux, macOS and Windows
#   argus-agent                                  Linux, macOS and Windows
#
# The servers and the verifier are portable Go, so they ship for all three: an
# auditor checks recordings on whatever their workstation runs, and the control
# plane can be tried on a laptop before it goes on a server. Only Linux gets
# deb, rpm and apk packages and systemd units; macOS and Windows get archives,
# and the macOS one carries the agent's launchd job. The Windows agent
# installs itself as a service (argus-agent service install). It records
# sessions opened through the console; direct sshd logins are not hooked on
# Windows yet, and the agent says so rather than claiming them.
#
# Packages are split rather than shipped as one bundle: the agent goes on every
# managed host, potentially thousands, while the gateway and control plane go on
# a handful of servers. Installing a gateway on every host to get the agent
# would be a large and pointless increase in attack surface.
#
#   goreleaser check          validate this file
#   goreleaser release --snapshot --clean    build locally without publishing

version: 2

project_name: argus

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # The console ships inside argus-control. Built same-origin (VITE_CONTROL_URL=/)
    # because the control plane serves it and the session cookie depends on it;
    # the gateway address comes from console.gateway_url at run time.
    - sh -c "cd web && bun install --frozen-lockfile && VITE_CONTROL_URL=/ bunx vite build --outDir dist-release --emptyOutDir --logLevel warn"

builds:
  - &gateway
    id: argus-gateway
    main: ./cmd/argus-gateway
    binary: argus-gateway
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    # -trimpath keeps build-machine paths out of the binary; -s -w drop the
    # symbol table and DWARF, which are of no use in production and of some use
    # to someone reverse engineering it.
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - &control
    id: argus-control
    main: ./cmd/argus-control
    binary: argus-control
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - &agent
    id: argus-agent
    main: ./cmd/argus-agent
    binary: argus-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - &verify
    id: argus-verify
    main: ./cmd/argus-verify
    binary: argus-verify
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # macOS: the three servers and the agent. Separate build ids from Linux so
  # each system's archive carries only what means something there.
  - <<: *gateway
    id: argus-gateway-darwin
    goos: [darwin]
  - <<: *control
    id: argus-control-darwin
    goos: [darwin]
  - <<: *verify
    id: argus-verify-darwin
    goos: [darwin]
  - <<: *agent
    id: argus-agent-darwin
    goos: [darwin]

  # Windows: the three servers and the agent.
  - <<: *gateway
    id: argus-gateway-windows
    goos: [windows]
  - <<: *control
    id: argus-control-windows
    goos: [windows]
  - <<: *verify
    id: argus-verify-windows
    goos: [windows]
  - <<: *agent
    id: argus-agent-windows
    goos: [windows]

archives:
  - id: default
    ids: [argus-gateway, argus-control, argus-agent, argus-verify]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: packaging/systemd/*.service
        dst: systemd
      - src: packaging/systemd/*.timer
        dst: systemd
      - src: docs/*
        dst: docs
      - src: packaging/config/*
        dst: config

  - id: darwin
    ids: [argus-gateway-darwin, argus-control-darwin, argus-verify-darwin, argus-agent-darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: docs/*
        dst: docs
      - src: packaging/config/control.example.yaml
        dst: config/control.example.yaml
      - src: packaging/config/gateway.yaml
        dst: config/gateway.yaml
      # No package installs the console here, so the archive carries it: point
      # console.dir at this folder.
      - src: web/dist-release
        dst: console
      # The agent's launchd job; see the comment inside it for installing.
      - src: packaging/launchd/com.argus.agent.plist
        dst: launchd/com.argus.agent.plist

  - id: windows
    ids: [argus-gateway-windows, argus-control-windows, argus-verify-windows, argus-agent-windows]
    # Explorer opens a zip with a double click; a tar.gz needs a tool.
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: docs/*
        dst: docs
      - src: packaging/config/control.example.yaml
        dst: config/control.example.yaml
      - src: packaging/config/gateway.yaml
        dst: config/gateway.yaml
      # No package installs the console here, so the archive carries it: point
      # console.dir at this folder.
      - src: web/dist-release
        dst: console

nfpms:
  # ── Agent: installed on every managed host ─────────────────────────────────
  - id: argus-agent
    package_name: argus-agent
    ids: [argus-agent]
    vendor: Argus
    homepage: https://github.com/gsoultan/argus
    maintainer: Argus Maintainers <noreply@example.com>
    description: |
      Argus host agent.
      Records privileged sessions on this host, including sessions that connect
      straight to sshd without passing through the Argus gateway, and reports
      how reachable the host is without Argus.
    license: Proprietary
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/argus-agent.service
        dst: /lib/systemd/system/argus-agent.service
      - src: packaging/config/agent.env
        dst: /etc/argus/agent.env
        type: config|noreplace
        file_info: {mode: 0600}
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    # openssh-server is a hard requirement: without sshd there is no session to
    # record and the ForceCommand hook has nothing to hook into.
    dependencies:
      - openssh-server
    overrides:
      apk:
        dependencies: [openssh]

  # ── Verifier: wherever recordings are checked ──────────────────────────────
  # Its own package because the gateway and the control plane both want it and
  # often share a host: two packages owning /usr/bin/argus-verify cannot both
  # be installed. It has no service and no config, so an auditor can install
  # it on a workstation that runs nothing else.
  - id: argus-verify
    package_name: argus-verify
    ids: [argus-verify]
    vendor: Argus
    homepage: https://github.com/gsoultan/argus
    maintainer: Argus Maintainers <noreply@example.com>
    description: |
      Argus recording verifier.
      Checks a session recording's hash chain against its recorded head,
      independently of the gateway and control plane that produced it.
    license: Proprietary
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    # Releases up to 0.1.x shipped this binary inside argus-gateway and
    # argus-control. Replaces lets dpkg hand the file over on upgrade instead
    # of refusing it. Not for rpm, where it would mean Obsoletes and remove
    # the gateway; there, upgrade the packages in one transaction.
    overrides:
      deb:
        replaces: [argus-gateway, argus-control]

  # ── Gateway ────────────────────────────────────────────────────────────────
  - id: argus-gateway
    package_name: argus-gateway
    ids: [argus-gateway]
    vendor: Argus
    homepage: https://github.com/gsoultan/argus
    maintainer: Argus Maintainers <noreply@example.com>
    description: |
      Argus SSH gateway.
      Brokers, records and authorises privileged SSH sessions.
    license: Proprietary
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/argus-gateway.service
        dst: /lib/systemd/system/argus-gateway.service
      - src: packaging/config/gateway.yaml
        dst: /etc/argus/gateway.yaml
        type: config|noreplace
        file_info: {mode: 0640}
      - src: packaging/config/gateway.env
        dst: /etc/argus/gateway.env
        type: config|noreplace
        file_info: {mode: 0600}
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

  # ── Control plane ──────────────────────────────────────────────────────────
  - id: argus-control
    package_name: argus-control
    ids: [argus-control]
    vendor: Argus
    homepage: https://github.com/gsoultan/argus
    maintainer: Argus Maintainers <noreply@example.com>
    description: |
      Argus control plane.
      System of record for sessions, assets, agent liveness and the
      hash-chained audit log.
    license: Proprietary
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/argus-control.service
        dst: /lib/systemd/system/argus-control.service
      # The web console, served by argus-control (console.dir).
      - src: web/dist-release/
        dst: /usr/share/argus/console
        type: tree
      # Installed, not enabled: `systemctl enable --now argus-backup.timer`.
      - src: packaging/systemd/argus-backup.service
        dst: /lib/systemd/system/argus-backup.service
      - src: packaging/systemd/argus-backup.timer
        dst: /lib/systemd/system/argus-backup.timer
      - src: packaging/config/control.yaml
        dst: /etc/argus/control.yaml
        type: config|noreplace
        file_info: {mode: 0640}
      - src: packaging/config/control.example.yaml
        dst: /usr/share/doc/argus-control/control.example.yaml
      - src: packaging/config/control.env
        dst: /etc/argus/control.env
        type: config|noreplace
        file_info: {mode: 0600}
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

# Checksums let an operator confirm they installed what was published, which is
# the least an access-management tool should offer.
checksum:
  name_template: "checksums.txt"

# Signing is on for real releases. A privileged-access product distributed
# without a way to verify provenance is asking to become a supply-chain vector.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    # Only in CI, where cosign keyless signing has an OIDC identity to bind to.
    ids: [default]

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github
  groups:
    - title: Security
      regexp: '^.*?(sec|security|fix\(sec\))[:\(].*$'
      order: 0
    - title: Features
      regexp: '^.*?feat[:\(].*$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix[:\(].*$'
      order: 2
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: gsoultan
    name: argus
  draft: true
  prerelease: auto
  footer: |
    ## Install

    ```sh
    # Debian / Ubuntu
    sudo dpkg -i argus-agent_{{ .Version }}_linux_amd64.deb

    # RHEL / Rocky / Alma
    sudo rpm -i argus-agent-{{ .Version }}.linux-amd64.rpm

    # Alpine
    sudo apk add --allow-untrusted argus-agent_{{ .Version }}_linux_amd64.apk
    ```

    On macOS and Windows, unpack `argus_{{ .Version }}_darwin_<arch>.tar.gz` or
    `argus_{{ .Version }}_windows_<arch>.zip`: the control plane, gateway and
    verifier, with the console in `console/`. The macOS archive also carries the
    agent and its launchd job in `launchd/`; the Windows archive carries the
    agent, which installs itself with `argus-agent service install`.

    Nothing starts on install. These services need certificates, secrets and an
    inventory first, and a package that starts a half-configured privileged
    access gateway is one that fails in the worst possible place.

    Verify what you downloaded:

    ```sh
    cosign verify-blob checksums.txt \
      --signature checksums.txt.sig \
      --certificate checksums.txt.pem \
      --certificate-identity-regexp 'https://github.com/gsoultan/argus/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum -c checksums.txt --ignore-missing
    ```
